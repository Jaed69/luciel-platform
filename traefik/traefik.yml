# traefik/traefik.yml — STATIC config only (versioned, no secrets).
# ACME resolver is defined below (not via CLI args): Traefik does NOT interpolate
# env vars in bind-mounted YAML files, so nothing secret belongs in this file.
# Middlewares (security headers, rate limit) live in traefik/dynamic/.

api:
  dashboard: true
  insecure: false  # Dashboard exposed via router + basicAuth, not insecure port

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      # Applied to every router on this entrypoint (defined in traefik/dynamic/).
      middlewares:
        - secure-headers@file
        - rate-limit@file

providers:
  docker:
    # Via docker-socket-proxy (read-only API filter), not the raw socket.
    endpoint: tcp://docker-socket-proxy:2375
    exposedByDefault: false
    network: traefik-public
  file:
    # A directory (not a single file): the deploy's `git reset --hard` swaps files
    # for new inodes, which a single-file bind mount would never see.
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog: {}

# /ping on the internal `traefik` entrypoint (:8080, not published) for the
# container healthcheck (`traefik healthcheck --ping`).
ping: {}

# ACME certificate resolver — defined here (not CLI args) because Traefik v3
# treats config-file and CLI-args as mutually exclusive. When traefik.yml is
# bind-mounted, Traefik loads it and ignores command: args entirely, which
# caused "nonexistent certificate resolver" errors.
# Staging→prod flip: comment the staging caServer line, uncomment the prod one.
certificatesResolvers:
  le:
    acme:
      email: twofigsthree@gmail.com
      storage: /acme.json
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory  # staging
      caServer: https://acme-v02.api.letsencrypt.org/directory  # production
      httpChallenge:
        entryPoint: web
