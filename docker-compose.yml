# docker-compose.yml — root orchestration (D-10: image: not build:).
# landing image is built by GitHub Actions -> GHCR (plan 01-02).

# Rotate container logs so they cannot fill the VPS disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# landing/lemon/apruebo: nginx (alpine) listens on 8080; busybox wget ships in the image.
x-nginx-healthcheck: &nginx-healthcheck
  test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  # Read-only Docker API filter: Traefik talks to this instead of the raw socket.
  # Mounting docker.sock into Traefik (even :ro) would give it full API access =
  # root on the host if Traefik is compromised. ":ro" only protects the socket
  # file itself, not the API calls made through it.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      # Only what Traefik's Docker provider needs (container discovery by labels).
      # POST and every other API section stay at the image default (denied).
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging: *default-logging

  traefik:
    image: traefik:v3.7.15
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # No docker.sock here: label discovery goes through docker-socket-proxy (D-19, T-01-01)
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic config (security headers + rate limit middlewares), file provider.
      # Mounted as a DIRECTORY: single-file bind mounts keep the old inode after the
      # deploy's `git reset --hard` replaces the file; a directory mount does not.
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # acme.json bind-mounted, chmod 600, gitignored (D-13, T-01-03)
      - ./traefik/letsencrypt/acme.json:/acme.json
    # ACME resolver configured in traefik/traefik.yml — CLI args are ignored
    # when a static config file is bind-mounted (Traefik v3 mutually-exclusive
    # rule between config-file / CLI-args / env-vars).
    labels:
      # Dashboard router — always on across restarts (D-17, D-18)
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.luciel.dev`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.tls.domains[0].main=traefik.luciel.dev"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      # basicAuth with bcrypt/MD5 hash from .env (T-01-04)
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USER:?TRAEFIK_DASHBOARD_USER is required}:${TRAEFIK_DASHBOARD_PASS_HASH:?TRAEFIK_DASHBOARD_PASS_HASH is required}"
    networks:
      - traefik-public
      - socket-proxy
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      # `ping` is enabled on the internal `traefik` entrypoint (traefik.yml).
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging: *default-logging

  landing:
    image: ghcr.io/${GHCR_OWNER:-jaed69}/luciel-platform-landing:${IMAGE_TAG:-latest}
    container_name: landing
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(`luciel.dev`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=le"
      - "traefik.http.routers.landing.tls.domains[0].main=luciel.dev"
      # nginx escucha en 8080 dentro del container (non-privileged, per Dockerfile).
      # Traefik defaulta a 80 si no se especifica — causaba 502 Bad Gateway.
      - "traefik.http.services.landing.loadbalancer.server.port=8080"
    networks:
      - traefik-public
    healthcheck: *nginx-healthcheck
    security_opt:
      - no-new-privileges:true
    # Verified locally: nginx master needs CHOWN/SETUID/SETGID to drop to the
    # worker user; everything else can go. Writable paths only via tmpfs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    mem_limit: 128m
    logging: *default-logging

  lemon:
    image: ghcr.io/${GHCR_OWNER:-jaed69}/luciel-platform-lemon:${IMAGE_TAG:-latest}
    container_name: lemon
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lemon.rule=Host(`lemon.luciel.dev`)"
      - "traefik.http.routers.lemon.entrypoints=websecure"
      - "traefik.http.routers.lemon.tls.certresolver=le"
      - "traefik.http.routers.lemon.tls.domains[0].main=lemon.luciel.dev"
      # nginx escucha en 8080 dentro del container (non-privileged, per Dockerfile).
      - "traefik.http.services.lemon.loadbalancer.server.port=8080"
    networks:
      - traefik-public
    healthcheck: *nginx-healthcheck
    security_opt:
      - no-new-privileges:true
    # Verified locally: nginx master needs CHOWN/SETUID/SETGID to drop to the
    # worker user; everything else can go. Writable paths only via tmpfs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    mem_limit: 128m
    logging: *default-logging

  # Built and pushed by the private Jaed69/apruebo repo (public image). Its tag is pinned
  # separately (APRUEBO_TAG, written by the deploy job), not by this repo's IMAGE_TAG.
  apruebo:
    image: ghcr.io/${GHCR_OWNER:-jaed69}/apruebo-web:${APRUEBO_TAG:-latest}
    container_name: apruebo
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apruebo.rule=Host(`apruebo.luciel.dev`)"
      - "traefik.http.routers.apruebo.entrypoints=websecure"
      - "traefik.http.routers.apruebo.tls.certresolver=le"
      - "traefik.http.routers.apruebo.tls.domains[0].main=apruebo.luciel.dev"
      - "traefik.http.services.apruebo.loadbalancer.server.port=8080"
    networks:
      - traefik-public
    healthcheck: *nginx-healthcheck
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    mem_limit: 128m
    logging: *default-logging

  # Apruebo's optional accounts API (same repo and APRUEBO_TAG as `apruebo`): the same host's
  # /api goes here, everything else to the web container. SQLite in apruebo-db-data.
  apruebo-api:
    image: ghcr.io/${GHCR_OWNER:-jaed69}/apruebo-api:${APRUEBO_TAG:-latest}
    container_name: apruebo-api
    restart: unless-stopped
    environment:
      - APRUEBO_DB=/data/apruebo.db
      - APRUEBO_ADDR=:8081
      - APRUEBO_WEB_ORIGIN=https://apruebo.luciel.dev
      # Public by design (the sign-in page shows it), so it lives here, not in the SOPS file.
      - GOOGLE_CLIENT_ID=753901411481-3vqfg82vuppv7e00pv9n9jkc2ukkhqrk.apps.googleusercontent.com
      # Email sign-in stays off until APRUEBO_SMTP_ADDR and APRUEBO_MAIL_FROM are added with
      # `sops edit env/production.env`.
      - APRUEBO_SMTP_ADDR=${APRUEBO_SMTP_ADDR:-}
      - APRUEBO_SMTP_USER=${APRUEBO_SMTP_USER:-}
      - APRUEBO_SMTP_PASSWORD=${APRUEBO_SMTP_PASSWORD:-}
      - APRUEBO_MAIL_FROM=${APRUEBO_MAIL_FROM:-}
    volumes:
      - apruebo-db-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apruebo-api.rule=Host(`apruebo.luciel.dev`) && PathPrefix(`/api`)"
      # Above the host-only `apruebo` router, whatever the rule lengths.
      - "traefik.http.routers.apruebo-api.priority=100"
      - "traefik.http.routers.apruebo-api.entrypoints=websecure"
      - "traefik.http.routers.apruebo-api.tls.certresolver=le"
      - "traefik.http.routers.apruebo-api.tls.domains[0].main=apruebo.luciel.dev"
      - "traefik.http.services.apruebo-api.loadbalancer.server.port=8081"
    # traefik-public also gives the egress Google key fetches and SMTP need.
    networks:
      - traefik-public
    # Distroless (no shell or wget): the binary checks its own /api/health.
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    logging: *default-logging

  # Opt-in (`--profile backup`), like tours-backup: replicates apruebo.db to the same bucket
  # under the `apruebo` path.
  apruebo-backup:
    image: litestream/litestream:0.5.17
    container_name: apruebo-backup
    profiles: [backup]
    # The API image runs as distroless nonroot (65532), which owns /data; root with every
    # capability dropped could not write Litestream's files next to the database.
    user: "65532:65532"
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream/litestream.yml"]
    environment:
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET:-}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT:-}
      - LITESTREAM_REGION=${LITESTREAM_REGION:-auto}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - apruebo-db-data:/data
      - ./apps/apruebo/litestream:/etc/litestream:ro
    networks:
      - apruebo-backup-egress
    depends_on:
      apruebo-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    logging: *default-logging

  tours-web:
    image: ghcr.io/${GHCR_OWNER:-jaed69}/luciel-platform-tours-web:${IMAGE_TAG:-latest}
    container_name: tours-web
    restart: unless-stopped
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://tours.luciel.dev}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - TOURS_API_URL=http://tours-api:8000
      # Next standalone binds to $HOSTNAME, which Docker resolves to only one of the
      # two network IPs; listen on all interfaces so Traefik can reach it.
      - HOSTNAME=0.0.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tours-web.rule=Host(`tours.luciel.dev`)"
      - "traefik.http.routers.tours-web.entrypoints=websecure"
      - "traefik.http.routers.tours-web.tls.certresolver=le"
      - "traefik.http.routers.tours-web.tls.domains[0].main=tours.luciel.dev"
      # Next.js 16 standalone server.js listens on 3000 inside the container.
      - "traefik.http.services.tours-web.loadbalancer.server.port=3000"
      # tours-web is on two networks; tell Traefik which one to use for routing.
      - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public
      - tours-internal
    depends_on:
      tours-api:
        condition: service_healthy
    healthcheck:
      # Any 2xx/3xx is healthy; redirect is not followed (/ may redirect to login).
      # Server listens on 0.0.0.0 (HOSTNAME above), so loopback works.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    logging: *default-logging

  tours-api:
    image: ghcr.io/${GHCR_OWNER:-jaed69}/luciel-platform-tours-api:${IMAGE_TAG:-latest}
    container_name: tours-api
    restart: unless-stopped
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Path interno del contenedor tours-api, no el path del host (D-03).
      - DATABASE_URL=sqlite+aiosqlite:////data/tours.db
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required}
    volumes:
      - tours-db-data:/data
    # NO traefik.http.routers.* labels — interno, sólo accesible vía Docker DNS desde tours-web (D-01).
    # Only on tours-internal (internal: true -> no published ports, no internet
    # egress; the API makes no outbound calls). landing/lemon cannot reach it.
    networks:
      - tours-internal
    # Healthcheck comes from the image's HEALTHCHECK (apps/tours/api/Dockerfile: GET /health).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    logging: *default-logging

  # Opt-in (`--profile backup`): continuous SQLite replication to S3-compatible
  # storage (R2 / OCI Object Storage). Reads the same volume as tours-api; WAL
  # coordination works across containers on one host.
  tours-backup:
    image: litestream/litestream:0.5.17
    container_name: tours-backup
    profiles: [backup]
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream/litestream.yml"]
    # Empty defaults on purpose: compose interpolates every service even when its
    # profile is off, so `:?` would break normal deploys. The deploy job only
    # enables this profile when LITESTREAM_ACCESS_KEY_ID is set.
    environment:
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET:-}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT:-}
      - LITESTREAM_REGION=${LITESTREAM_REGION:-auto}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - tours-db-data:/data
      # Directory mount (not a single file) so config edits survive `git reset --hard`.
      - ./apps/tours/litestream:/etc/litestream:ro
    # Needs outbound internet to reach the bucket, so it cannot sit on the
    # internal-only tours-internal network.
    networks:
      - tours-backup-egress
    depends_on:
      tours-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    logging: *default-logging

networks:
  traefik-public:
    external: true
    name: traefik-public
  # Traefik <-> socket proxy only; internal so the proxy is unreachable from outside.
  socket-proxy:
    internal: true
  # tours-web <-> tours-api only.
  tours-internal:
    internal: true
  # tours-backup -> internet only (no other service attached).
  tours-backup-egress: {}
  # apruebo-backup -> internet only.
  apruebo-backup-egress: {}

volumes:
  tours-db-data:
    name: tours-db-data
  apruebo-db-data:
    name: apruebo-db-data
