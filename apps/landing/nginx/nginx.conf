# nginx serving Astro static dist (D-02). Listens on 8080 (non-privileged).
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Root language: the first Accept-Language tag the browser sends (never the IP address).
  map $http_accept_language $prefers_es {
    default 0;
    "~*^\s*es\b" 1;
  }

  # A choice made in the language switcher (the lang cookie) wins over the header; English stays on /.
  map "$cookie_lang:$prefers_es" $root_to_es {
    default 0;
    ":1" 1;
    "~^es:" 1;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 404 /404.html;
    location = /404.html {
      root /usr/share/nginx/html;
      internal;
    }

    # Spanish section: unknown /es/ paths get the Spanish 404 (Astro emits dist/es/404/index.html: only the root 404 is special-cased).
    location = /es/404/index.html {
      error_page 404 /es/404/index.html;
      internal;
    }

    # Direct visits to the Spanish 404 page must still answer 404 (avoids a soft 404).
    location ~ ^/es/404/?$ {
      error_page 404 /es/404/index.html;
      return 404;
    }

    location /es/ {
      error_page 404 /es/404/index.html;
      try_files $uri $uri/index.html =404;
    }

    # Only the exact root redirects, and only temporarily: shared links and crawlers keep the page they asked for.
    location = / {
      # Relative Location header: behind the proxy, an absolute one would carry the container's port 8080.
      absolute_redirect off;
      add_header Vary "Accept-Language, Cookie" always;
      if ($root_to_es) {
        return 302 /es/;
      }
      try_files /index.html =404;
    }

    location / {
      try_files $uri $uri/index.html =404;
    }
  }
}
