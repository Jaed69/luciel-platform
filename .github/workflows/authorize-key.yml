# One-off helper to re-authorize an SSH public key on the VPS, for when the
# local private key that pairs with VPS_SSH_KEY was lost. It reuses the same
# deploy secrets (VPS_HOST/VPS_USER/VPS_SSH_KEY) and ONLY rewrites the supplied
# public key into ~/.ssh/authorized_keys. It touches nothing else: no pull, no
# compose, no production deploy. Run it from the Actions tab (or `gh workflow
# run authorize-key.yml -f public_key='ssh-ed25519 AAAA... comment'`), then
# delete this file once access is recovered.
name: Authorize SSH key (manual recovery)

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: 'Public key line to authorize (ssh-ed25519 / ssh-rsa / ecdsa-sha2-nistp256 ...)'
        required: true

permissions:
  contents: read

concurrency: authorize-key

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Re-authorize the public key on the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEW_PUBKEY
          # The value reaches a remote shell, so it is sanitized (CRLF and stray
          # whitespace stripped — the key often comes from a Windows file) and
          # validated there, and only ever written with printf '%s' (never
          # eval'd). Any earlier copy of the same key body is removed first, so a
          # previously mangled line cannot linger.
          script: |
            set -eu

            # Strip CR, surrounding whitespace, and collapse to one line.
            clean="$(printf '%s' "$NEW_PUBKEY" | tr -d '\r' | tr '\n' ' ' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            if ! printf '%s' "$clean" \
              | grep -Eq '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) AAAA[0-9A-Za-z+/]+=*( .*)?$'; then
              echo "Not a valid OpenSSH public key line" >&2
              exit 1
            fi

            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"

            key_body="$(printf '%s' "$clean" | cut -d' ' -f1,2)"

            # Show what is there now, with control characters visible (^M = stray CR).
            echo "=== BEFORE (last 3 lines, control chars shown) ==="
            tail -n 3 "$HOME/.ssh/authorized_keys" | cat -A || true

            # Drop any existing entry with the same key body (handles a mangled copy),
            # then append exactly one clean line.
            tmp="$(mktemp)"
            awk -v b="$key_body" '{ k=$1" "$2 } k != b { print }' \
              "$HOME/.ssh/authorized_keys" > "$tmp" || true
            printf '%s\n' "$clean" >> "$tmp"
            cat "$tmp" > "$HOME/.ssh/authorized_keys"
            rm -f "$tmp"
            chmod 600 "$HOME/.ssh/authorized_keys"

            echo "=== AFTER (last line, control chars shown) ==="
            tail -n 1 "$HOME/.ssh/authorized_keys" | cat -A
            echo "Fingerprint now authorized:"
            printf '%s' "$clean" | ssh-keygen -lf - || true
            echo "authorized_keys line count: $(wc -l < "$HOME/.ssh/authorized_keys")"

            # Non-secret account diagnostics (home path shows as *** if it is secret).
            echo "=== account ==="
            id
            stat -c '%n  %A  %U:%G' "$HOME" "$HOME/.ssh" "$HOME/.ssh/authorized_keys"
        env:
          NEW_PUBKEY: ${{ github.event.inputs.public_key }}
