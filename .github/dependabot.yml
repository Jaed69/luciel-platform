# Weekly dependency PRs, minor/patch only, grouped per ecosystem to limit noise.
# Major bumps are ignored here and taken deliberately (see odd/tasks/major-deps-upgrade.md).
# The ignore applies to version updates only: security updates (repo setting
# "Dependabot security updates") still open PRs for any version, majors included.
# Note: docker tags count Python 3.14 -> 3.15 as minor, so those still arrive.
# Pinned action SHAs and pinned base-image versions only stay fresh because of this file.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # pnpm workspace (root lockfile covers every JS app).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /apps/tours/api
    schedule:
      interval: weekly
    groups:
      uv:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images pinned in each app Dockerfile.
  - package-ecosystem: docker
    directories:
      - /apps/landing
      - /apps/lemon
      - /apps/tours/web
      - /apps/tours/api
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Images pinned in docker-compose.yml (traefik, socket proxy, litestream).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
