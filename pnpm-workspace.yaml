packages:
  - 'apps/*'
  - 'apps/tours/web'

# pnpm v11+ reads build-script allowlist here (not package.json).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Astro 7.0.6 + integrations published 2026-07-02 — verified legitimate in
# .planning/.../01-RESEARCH.md (all from github.com/withastro/astro, [OK]).
# pnpm 11.9 default minimumReleaseAge (1d) blocks them; override for this project.
minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security overrides for transitive deps flagged by Dependabot.
# Majors are preserved; only the patched floor is raised.
overrides:
  source-map-js: ^1.2.2
  http-cache-semantics: ^4.3.0
  brace-expansion@^1: ^1.1.21
  brace-expansion@^5: ^5.0.12
  baseline-browser-mapping: ^2.11.0
  browserslist: ^4.28.7
  fast-xml-parser: ^5.10.1
